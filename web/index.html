<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Codex vs Bugs, a crowd quiz RPG for meetup rooms.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Codex vs Bugs">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Codex vs Bugs</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    window.codexSound = (() => {
      let ctx;
      const patterns = {
        click: [220],
        start: [196, 262, 330, 523],
        question: [330, 440],
        answer: [294, 392],
        correct: [523, 659, 784],
        wrong: [196, 147],
        damage: [110, 165, 220],
        victory: [392, 523, 659, 784, 1046, 1318, 1568],
        defeat: [220, 196, 165, 147, 123, 110],
      };
      function context() {
        ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        return ctx;
      }
      function tone(audio, frequency, start, duration, type, volume) {
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(frequency, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(volume, start + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        osc.connect(gain).connect(audio.destination);
        osc.start(start);
        osc.stop(start + duration + 0.02);
      }
      return function play(cue) {
        try {
          const audio = context();
          const notes = patterns[cue] || patterns.click;
          const now = audio.currentTime + 0.01;
          const isFinal = cue === 'victory' || cue === 'defeat';
          notes.forEach((note, index) => {
            tone(
              audio,
              note,
              now + index * (isFinal ? 0.115 : 0.075),
              isFinal ? 0.12 : 0.065,
              cue === 'wrong' || cue === 'defeat' ? 'sawtooth' : 'square',
              isFinal ? 0.07 : 0.045
            );
          });
        } catch (_) {}
      };
    })();
  </script>
  <!--

    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
